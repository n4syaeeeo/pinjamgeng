<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 550 680" width="550" height="680">
  <defs>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Card container with mauve/purple border -->
  <rect x="5" y="5" width="540" height="670" rx="16" fill="#FFFFFF" stroke="#853D60" stroke-width="3" filter="url(#cardShadow)"/>

  <!-- Top Google Form header banner (warm festive event equipment gradient) -->
  <g transform="translate(15, 15)">
    <rect width="520" height="150" rx="10" fill="#673AB7"/>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A148C"/>
      <stop offset="50%" stop-color="#673AB7"/>
      <stop offset="100%" stop-color="#9C27B0"/>
    </linearGradient>
    <rect width="520" height="150" rx="10" fill="url(#headerGrad)"/>
    
    <!-- Abstract audio/visual wave pattern on banner -->
    <g stroke="#FFFFFF" fill="none" opacity="0.25" stroke-linecap="round">
      <path d="M20,75 Q70,20 120,75 T220,75 T320,75 T420,75 T500,75" stroke-width="5"/>
      <path d="M20,95 Q70,50 120,95 T220,95 T320,95 T420,95 T500,95" stroke-width="3" stroke-dasharray="10,8"/>
    </g>
    <!-- Event equipment badge text on banner -->
    <rect x="25" y="25" width="160" height="26" rx="6" fill="#FFFFFF" fill-opacity="0.2"/>
    <text x="35" y="42" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="10.5" fill="#FFFFFF" letter-spacing="0.8">UPTM FCOM • FYP3024</text>
    <text x="25" y="85" font-family="Montserrat, Arial Black, sans-serif" font-weight="900" font-size="22" fill="#FFFFFF">PINJAMGENG</text>
    <text x="25" y="112" font-family="Montserrat, Arial, sans-serif" font-weight="600" font-size="13" fill="#E1BEE7">User Acceptance Testing (UAT) Form</text>
  </g>

  <!-- Questionnaire Title & Details -->
  <g transform="translate(35, 195)">
    <text x="0" y="24" font-family="Montserrat, Arial Black, sans-serif" font-weight="900" font-size="19" fill="#1F2937">Post-Development Questionnaire:</text>
    <text x="0" y="48" font-family="Montserrat, Arial Black, sans-serif" font-weight="900" font-size="19" fill="#853D60">PinjamGeng System</text>
    
    <text x="0" y="82" font-family="Arial, sans-serif" font-weight="600" font-size="12" fill="#374151">Assalamualaikum, and hello everyone! 👋</text>
    
    <text x="0" y="112" font-family="Arial, sans-serif" font-size="11.5" fill="#4B5563" line-height="1.5">
      <tspan x="0" dy="0">My name is Nursyafiqah Zulaikha Binti Zilkamal, a student</tspan>
      <tspan x="0" dy="18">of Diploma in Computer Science (CC101) from Universiti</tspan>
      <tspan x="0" dy="18">Poly-Tech Malaysia (UPTM), Faculty of Computing &amp; Multimedia.</tspan>
    </text>

    <text x="0" y="190" font-family="Arial, sans-serif" font-size="11.5" fill="#4B5563">
      <tspan x="0" dy="0">This questionnaire evaluates my Final Year Project: "Smart Event</tspan>
      <tspan x="0" dy="18">Equipment Booking &amp; Inventory Management System (PinjamGeng)".</tspan>
    </text>

    <text x="0" y="250" font-family="Arial, sans-serif" font-size="11.5" fill="#4B5563">
      <tspan x="0" dy="0">The purpose of this survey is to collect genuine feedback on the</tspan>
      <tspan x="0" dy="18">user experience, usability, navigation, conflict elimination, and</tspan>
      <tspan x="0" dy="18">system reliability from UPTM student leaders &amp; faculty members.</tspan>
    </text>

    <!-- Info pill box -->
    <rect x="0" y="330" width="480" height="90" rx="10" fill="#F3E8FF" stroke="#D8B4FE" stroke-width="1.5"/>
    <text x="18" y="356" font-family="Montserrat, Arial, sans-serif" font-weight="800" font-size="11" fill="#6B21A8">📋 SURVEY STRUCTURE (6 SECTIONS):</text>
    <text x="18" y="378" font-family="Arial, sans-serif" font-size="10.5" fill="#581C87">Section A: Profile • Section B: Usability • Section C: Functionality</text>
    <text x="18" y="398" font-family="Arial, sans-serif" font-size="10.5" fill="#581C87">Section D: User Experience • Section E: Reliability • Section F: Feedback</text>

    <text x="0" y="445" font-family="Arial, sans-serif" font-weight="600" font-size="10.5" fill="#6B7280">
      * All responses are strictly confidential and recorded for FYP academic purposes.
    </text>
  </g>
</svg>