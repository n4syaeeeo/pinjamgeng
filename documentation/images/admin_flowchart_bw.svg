<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 1180" width="820" height="1180" style="background-color:#ffffff;">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000" />
    </marker>
  </defs>
  <style>
    text { font-family: Arial, sans-serif; font-size: 11px; fill: #000000; text-anchor: middle; }
    .title { font-size: 14px; font-weight: bold; }
    .label { font-size: 10px; font-weight: bold; }
    rect, polygon, ellipse, circle { stroke: #000000; stroke-width: 1.5; fill: #ffffff; }
    line, path { stroke: #000000; stroke-width: 1.5; fill: none; }
  </style>

  <!-- START -->
  <ellipse cx="410" cy="40" rx="50" ry="20" />
  <text x="410" y="44" class="label">START</text>
  <line x1="410" y1="60" x2="410" y2="90" marker-end="url(#arrow)" />

  <!-- Login Form -->
  <rect x="340" y="90" width="140" height="40" />
  <text x="410" y="114">Login</text>
  <line x1="410" y1="130" x2="410" y2="160" marker-end="url(#arrow)" />

  <!-- Decision: Verify User -->
  <polygon points="410,160 490,195 410,230 330,195" />
  <text x="410" y="199">Verify user?</text>

  <!-- No -> Error / Access Denied -->
  <line x1="490" y1="195" x2="580" y2="195" marker-end="url(#arrow)" />
  <text x="525" y="188">No</text>
  <polygon points="595,175 720,175 695,215 570,215" />
  <text x="645" y="199">Invalid Credentials</text>
  <line x1="645" y1="175" x2="645" y2="110" />
  <line x1="645" y1="110" x2="480" y2="110" marker-end="url(#arrow)" />

  <!-- Yes -> Successfully Logged in -->
  <line x1="410" y1="230" x2="410" y2="270" marker-end="url(#arrow)" />
  <text x="425" y="250">Yes</text>
  <polygon points="350,270 490,270 470,305 330,305" />
  <text x="410" y="292">Successfully Logged In</text>
  <line x1="410" y1="305" x2="410" y2="345" marker-end="url(#arrow)" />

  <!-- Decision: Choose Activity -->
  <polygon points="410,345 500,380 410,415 320,380" />
  <text x="410" y="384">Choose Activity</text>

  <!-- Bus lines out of Choose Activity -->
  <line x1="410" y1="415" x2="410" y2="445" />
  <line x1="125" y1="445" x2="695" y2="445" />

  <!-- Branch 1: Manage Bookings -->
  <line x1="125" y1="445" x2="125" y2="470" marker-end="url(#arrow)" />
  <polygon points="70,470 195,470 180,505 55,505" />
  <text x="125" y="492">Booking Requests</text>
  <line x1="125" y1="505" x2="125" y2="530" marker-end="url(#arrow)" />
  <rect x="55" y="530" width="140" height="35" />
  <text x="125" y="552">Review Booking Details</text>
  <line x1="125" y1="565" x2="125" y2="590" marker-end="url(#arrow)" />
  <polygon points="125,590 185,615 125,640 65,615" />
  <text x="125" y="619">Approve?</text>
  <!-- Approve Yes -->
  <line x1="125" y1="640" x2="125" y2="670" marker-end="url(#arrow)" />
  <text x="140" y="655">Yes</text>
  <rect x="55" y="670" width="140" height="35" />
  <text x="125" y="692">Allocate Equipment Stock</text>
  <line x1="125" y1="705" x2="125" y2="735" marker-end="url(#arrow)" />
  <rect x="55" y="735" width="140" height="35" />
  <text x="125" y="757">Issue Loan Agreement Slip</text>
  <!-- Approve No -->
  <line x1="65" y1="615" x2="30" y2="615" />
  <line x1="30" y1="615" x2="30" y2="790" />
  <line x1="30" y1="790" x2="125" y2="790" />
  <text x="45" y="610">No</text>
  <line x1="125" y1="770" x2="125" y2="830" />

  <!-- Branch 2: Inventory & Packages -->
  <line x1="315" y1="445" x2="315" y2="470" marker-end="url(#arrow)" />
  <polygon points="255,470 390,470 375,505 240,505" />
  <text x="315" y="492">Equipment &amp; Packages</text>
  <line x1="315" y1="505" x2="315" y2="530" marker-end="url(#arrow)" />
  <rect x="245" y="530" width="140" height="35" />
  <text x="315" y="552">Add / Edit Equipment</text>
  <line x1="315" y1="565" x2="315" y2="595" marker-end="url(#arrow)" />
  <rect x="245" y="595" width="140" height="35" />
  <text x="315" y="617">Manage Package Bundles</text>
  <line x1="315" y1="630" x2="315" y2="660" marker-end="url(#arrow)" />
  <rect x="245" y="660" width="140" height="35" />
  <text x="315" y="682">Update Categories &amp; Specs</text>
  <line x1="315" y1="695" x2="315" y2="830" />

  <!-- Branch 3: Returns & Maintenance Desk -->
  <line x1="505" y1="445" x2="505" y2="470" marker-end="url(#arrow)" />
  <polygon points="445,470 580,470 565,505 430,505" />
  <text x="505" y="492">Return Desk Inspection</text>
  <line x1="505" y1="505" x2="505" y2="530" marker-end="url(#arrow)" />
  <rect x="435" y="530" width="140" height="35" />
  <text x="505" y="552">Inspect Item Condition</text>
  <line x1="505" y1="565" x2="505" y2="595" marker-end="url(#arrow)" />
  <polygon points="505,595 565,620 505,645 445,620" />
  <text x="505" y="624">Damaged?</text>
  <!-- Yes -> Auto-generate ticket -->
  <line x1="505" y1="645" x2="505" y2="675" marker-end="url(#arrow)" />
  <text x="520" y="660">Yes</text>
  <rect x="435" y="675" width="140" height="35" />
  <text x="505" y="697">Log Maintenance Ticket</text>
  <!-- No -> Restock -->
  <line x1="565" y1="620" x2="590" y2="620" />
  <line x1="590" y1="620" x2="590" y2="730" />
  <line x1="590" y1="730" x2="505" y2="730" />
  <text x="578" y="612">No</text>
  <line x1="505" y1="710" x2="505" y2="745" marker-end="url(#arrow)" />
  <rect x="435" y="745" width="140" height="35" />
  <text x="505" y="767">Restock &amp; Mark Returned</text>
  <line x1="505" y1="780" x2="505" y2="830" />

  <!-- Branch 4: Reports & Analytics -->
  <line x1="695" y1="445" x2="695" y2="470" marker-end="url(#arrow)" />
  <polygon points="640,470 765,470 750,505 625,505" />
  <text x="695" y="492">Reports &amp; Analytics</text>
  <line x1="695" y1="505" x2="695" y2="530" marker-end="url(#arrow)" />
  <rect x="625" y="530" width="140" height="35" />
  <text x="695" y="552">View Utilization Reports</text>
  <line x1="695" y1="565" x2="695" y2="595" marker-end="url(#arrow)" />
  <polygon points="695,595 755,620 695,645 635,620" />
  <text x="695" y="624">Export?</text>
  <!-- Yes -> PDF/CSV -->
  <line x1="695" y1="645" x2="695" y2="675" marker-end="url(#arrow)" />
  <text x="710" y="660">Yes</text>
  <rect x="625" y="675" width="140" height="35" />
  <text x="695" y="697">Download PDF / CSV</text>
  <line x1="635" y1="620" x2="610" y2="620" />
  <line x1="610" y1="620" x2="610" y2="730" />
  <line x1="610" y1="730" x2="695" y2="730" />
  <text x="620" y="612">No</text>
  <line x1="695" y1="710" x2="695" y2="830" />

  <!-- Convergence Bar to Connector -->
  <line x1="125" y1="830" x2="695" y2="830" />
  <line x1="410" y1="830" x2="410" y2="860" marker-end="url(#arrow)" />
  <circle cx="410" cy="870" r="10" />
  <line x1="410" y1="880" x2="410" y2="915" marker-end="url(#arrow)" />

  <!-- Decision: Logout? -->
  <polygon points="410,915 490,950 410,985 330,950" />
  <text x="410" y="954">Logout?</text>

  <!-- Logout No -> loop back to Choose Activity -->
  <line x1="330" y1="950" x2="25" y2="950" />
  <line x1="25" y1="950" x2="25" y2="380" />
  <line x1="25" y1="380" x2="320" y2="380" marker-end="url(#arrow)" />
  <text x="175" y="942">No (Continue Session)</text>

  <!-- Logout Yes -> End -->
  <line x1="410" y1="985" x2="410" y2="1025" marker-end="url(#arrow)" />
  <text x="425" y="1005">Yes</text>
  <ellipse cx="410" cy="1045" rx="50" ry="20" />
  <text x="410" y="1049" class="label">END</text>
</svg>
